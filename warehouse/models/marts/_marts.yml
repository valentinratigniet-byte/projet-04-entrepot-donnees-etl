version: 2

models:
  - name: dim_date
    description: "Dimension date (calendrier) enrichie de la météo quotidienne."
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [unique, not_null]
  - name: fct_sales
    description: "Faits ventes (grain : ligne de commande), reliés aux 3 dimensions."
    columns:
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: line_amount
        tests: [not_null]
